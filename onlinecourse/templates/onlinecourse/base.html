<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Online Course{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f7fb;color:#18253b}main{max-width:1000px}.card{border:1px solid #e1e6ef}.navbar{background:#18364c}.choice{padding:8px 12px;border-radius:5px;margin:6px 0}.correct{background:#e8f6ed}.incorrect{background:#fce9e9}.muted{background:#f3f4f6}h1{font-weight:700}.badge{font-size:.8rem}</style>
</head><body>
<nav class="navbar navbar-dark px-4 py-3"><a class="navbar-brand" href="{% url 'onlinecourse:index' %}">Online Course</a>
<div class="d-flex align-items-center gap-3 text-white">{% if user.is_authenticated %}<span>{{ user.username }}</span><form method="post" action="{% url 'onlinecourse:logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Log out</button></form>{% else %}<a class="text-white" href="{% url 'onlinecourse:login' %}">Log in</a><a class="text-white" href="{% url 'onlinecourse:registration' %}">Register</a>{% endif %}</div></nav>
<main class="container py-4">{% block content %}{% endblock %}</main></body></html>
